name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: symfonystore
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/symfonystore?serverVersion=8.0
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql, zip
          tools: composer
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php bin/console doctrine:database:create --if-not-exists --env=test
      - run: php bin/console doctrine:migrations:migrate -n --env=test
      - run: php bin/phpunit

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest