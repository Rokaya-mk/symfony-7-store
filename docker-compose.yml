services:
  app:
    build: .
    volumes: [".:/var/www/html"]
    environment:
      DATABASE_URL: "mysql://app:app@db:3306/symfonystore?serverVersion=8.0"
    depends_on: [db]
  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ".:/var/www/html"
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on: [app]
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: symfonystore
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes: ["dbdata:/var/lib/mysql"]
volumes:
  dbdata: